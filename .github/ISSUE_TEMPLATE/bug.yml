name: Something broke
description: A command failed, an app looks wrong, or restore didn't undo something.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: App and version
      placeholder: Cursor 3.23.12
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `diorama doctor`
      render: text
  - type: textarea
    id: output
    attributes:
      label: Command output or screenshot
      description: Check that screenshots don't show your chats, code or file names you'd rather keep private.
