<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>diorama</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>diorama</h1>
      <label class="toggle" title="Turn all themes on or off">
        <input type="checkbox" id="enabled" />
        <span>On</span>
      </label>
    </header>

    <section class="controls">
      <label for="theme">Theme</label>
      <select id="theme"></select>
      <img id="preview" alt="" hidden />
      <p id="description" class="muted"></p>

      <label for="mark">Style</label>
      <select id="mark"></select>

      <label for="fps">Frame rate</label>
      <select id="fps">
        <option value="0">Theme default</option>
        <option value="15">15 fps</option>
        <option value="30">30 fps</option>
        <option value="60">60 fps</option>
      </select>

      <label class="check"><input type="checkbox" id="site" /> <span>Theme <b id="host">this site</b></span></label>
      <label class="check"><input type="checkbox" id="paused" /> <span>Pause the animation</span></label>
    </section>

    <section class="page">
      <h2>This page</h2>
      <p id="summary" class="muted">Checking…</p>
      <ul id="slots"></ul>
      <button id="inspect" type="button" hidden>Find what still hides the background</button>
      <ol id="blockers"></ol>
    </section>

    <script src="catalog.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
